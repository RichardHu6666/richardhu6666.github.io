---
layout: compress
---
{% include base_path %}
<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js">
<head>
  {% include head.html %}
  {% include head/custom.html %}
  <style>
    .main-container {
      display: flex;
      flex: 1;
      align-items: stretch;
      width: min(100%, 1280px);
      margin: 0 auto;
    }
    .left-sidebar {
      box-sizing: border-box;
      width: 300px;
      flex: 0 0 300px;
      padding: 0 24px;
      border-right: 1px solid #e7ecef;
      background: #fff;
    }
    .right-content {
      box-sizing: border-box;
      min-width: 0;
      flex: 1;
      padding: 0 22px;
    }
    @media (max-width: 1024px) {
      .main-container {
        flex-direction: column;
      }
      .left-sidebar {
        width: 100%;
        flex-basis: auto;
        padding: 20px 22px;
        border-right: 0;
        border-bottom: 1px solid #e7ecef;
      }
      .right-content {
        padding: 20px 22px;
      }
    }
  </style>
</head>
<body style="margin:0; display:flex; flex-direction:column; min-height:100vh; background:#fff;">
  {% include masthead.html %}
  <div id="main" role="main" class="main-container">
    <aside class="sidebar left-sidebar">
      {% include author-profile.html %}
    </aside>
    <article class="page right-content">
      {{ content }}
    </article>
  </div>
  {% include footer.html %}
  {% include scripts.html %}
</body>
</html>
