{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

{% comment %}
  Tell search engines the two language versions are the same page. Emitted on
  both pages so each one advertises the other and itself.
{% endcomment %}
<link rel="alternate" hreflang="en" href="{{ site.url }}/">
<link rel="alternate" hreflang="zh-Hans" href="{{ site.url }}/zh/">
<link rel="alternate" hreflang="x-default" href="{{ site.url }}/">

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">
